[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-sidecar"
version = "0.1.0"
description = "Local Python sidecar for Desk Pilot: LangGraph agent with retrieval-augmented generation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["desk_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
